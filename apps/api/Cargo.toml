[package]
name = "migration-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "migration_api"
path = "src/lib.rs"

[[bin]]
name = "migration-api"
path = "src/main.rs"

[[bin]]
name = "migration-admin"
path = "src/bin/admin.rs"

[[bin]]
name = "migration-license-server"
path = "src/bin/license_server.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
aws-config = { version = "1.5", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-s3 = { version = "1.60", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-types = { version = "1.2", features = ["rt-tokio"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
csv = "1.3"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
humantime = "2.1"
hyper = "1"
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
jsonwebtoken = "9"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
opentelemetry = "0.24"
opentelemetry-otlp = { version = "0.17", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
prometheus = "0.13"
quick-xml = { version = "0.36", features = ["serialize"] }
rand = "0.8"
redis = { version = "0.27", features = ["tokio-rustls-comp", "aio"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "macros", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.12", features = ["tls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util", "set-header"] }
tracing = "0.1"
tracing-opentelemetry = "0.25"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
testcontainers = { version = "0.23", features = ["blocking"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
http-body-util = "0.1"
serde_json = "1"
