name: ci
on:
  push:
    branches: [main]
    # Release tags must pass CI too: images.yml promotes only CI-validated SHAs.
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path apps/api/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/api/Cargo.toml
      - run: cargo test --manifest-path apps/api/Cargo.toml --test integration_db -- --ignored
      - run: cargo test --manifest-path apps/api/Cargo.toml --test source_authz -- --ignored
      - run: cargo test --manifest-path apps/api/Cargo.toml --test operations_api -- --ignored
      - run: cargo test --manifest-path apps/api/Cargo.toml --test job_lifecycle -- --ignored

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/orchestrator-go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: apps/orchestrator-go
      - name: Destination fixture
        working-directory: tests/harness/destination
        run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/transform-worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check migration_worker tests
      - run: PYTHONPATH=. pytest -q
      - name: Harness reconciler unit tests
        working-directory: .
        run: python3 -m unittest discover -s tests/harness -p 'test_*.py'

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/rule-schema } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/rule-schema/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [rust, go, python, web, schema]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm dependency build infra/k8s/helm
      - run: helm lint infra/k8s/helm --set secrets.bridgeToken=ci-bridge-token-at-least-32-characters --set secrets.masterKey=ci-master-key-change-me-32-bytes
      - run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.harness.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build + start stack
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.harness.yml up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz && break || sleep 3
          done
          curl -fsS http://localhost:18099/_admin/healthz
      - name: Seed demo org + template
        run: ./scripts/seed.sh
      - name: Integrity harness
        run: |
          python3 tests/harness/harness.py setup
          # continue-as-new is ~4 minutes and is run locally / on demand.
          python3 -u tests/harness/harness.py run \
            source-authz ordinary python-transforms forced-failure throttle-recovers \
            ambiguous-idempotent ambiguous-lookup ambiguous-manual destination-auth \
            retry-serialized ingest-failure terminated-workflow export-recovery
      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-out
          path: tests/harness/out
          if-no-files-found: ignore
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6 python3
      - name: Generate synthetic CSV
        run: python3 tests/load/generate_csv.py --rows 1000 --out /tmp/smoke.csv
      - name: Run smoke test
        env:
          API: http://localhost:8080
          RULE_TEMPLATE_ID: "1"
          SOURCE_CSV: /tmp/smoke.csv
        run: |
          TOKEN=$(curl -fsS -X POST "$API/auth/login" \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"admin123"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          TOKEN=$TOKEN k6 run tests/load/smoke_laptop.js
      - name: Install Playwright + deps
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8080
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: admin123
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.harness.yml logs --no-color | tail -n 500
