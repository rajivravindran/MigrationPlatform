apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mp.fullname" . }}-orchestrator
  labels: {{- include "mp.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: orchestrator
          image: {{ include "mp.image" .Values.orchestrator.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.orchestrator.service.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "mp.fullname" . }}-env
            - secretRef:
                name: {{ include "mp.fullname" . }}-secrets
          env:
            {{- range $k, $v := .Values.orchestrator.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: METRICS_BIND
              value: "0.0.0.0:9464"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources: {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          livenessProbe:
            tcpSocket: { port: 9464 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          securityContext: {{- toYaml .Values.orchestrator.securityContext | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mp.fullname" . }}-orchestrator
  labels: {{- include "mp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: orchestrator
  ports:
    - name: metrics
      port: {{ .Values.orchestrator.service.metricsPort }}
      targetPort: metrics
{{- if .Values.orchestrator.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mp.fullname" . }}-orchestrator
  labels: {{- include "mp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "mp.fullname" . }}-orchestrator
  minReplicas: {{ .Values.orchestrator.hpa.minReplicas }}
  maxReplicas: {{ .Values.orchestrator.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.orchestrator.hpa.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mp.fullname" . }}-orchestrator
  labels: {{- include "mp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.orchestrator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orchestrator
