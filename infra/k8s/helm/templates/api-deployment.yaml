apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mp.fullname" . }}-api
  labels: {{- include "mp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: api
          image: {{ tpl .Values.api.image . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.httpPort }}
            - name: metrics
              containerPort: {{ .Values.api.service.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "mp.fullname" . }}-env
            - secretRef:
                name: {{ include "mp.fullname" . }}-secrets
          env:
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: JWT_PRIVATE_KEY_PATH
              value: /run/secrets/jwt_private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /run/secrets/jwt_public.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: license-data
              mountPath: /var/lib/migration
            - name: installation-id
              mountPath: /run/installation
              readOnly: true
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe: {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          livenessProbe: {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          securityContext: {{- toYaml .Values.api.securityContext | nindent 12 }}
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ include "mp.fullname" . }}-secrets
            items:
              - key: jwt_private.pem
                path: jwt_private.pem
              - key: jwt_public.pem
                path: jwt_public.pem
        - name: tmp
          emptyDir: {}
        - name: license-data
          persistentVolumeClaim:
            claimName: {{ include "mp.fullname" . }}-license
        - name: installation-id
          secret:
            secretName: {{ default (printf "%s-installation" (include "mp.fullname" .)) .Values.license.existingInstallationSecret }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mp.fullname" . }}-api
  labels: {{- include "mp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.httpPort }}
      targetPort: http
    - name: metrics
      port: {{ .Values.api.service.metricsPort }}
      targetPort: metrics
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mp.fullname" . }}-api
  labels: {{- include "mp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "mp.fullname" . }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mp.fullname" . }}-api
  labels: {{- include "mp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
