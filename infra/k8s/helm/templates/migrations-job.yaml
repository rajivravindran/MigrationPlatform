apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mp.fullname" . }}-migrate
  labels: {{- include "mp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "mp.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ tpl .Values.migrations.image . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/app/migration-admin", "migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "mp.fullname" . }}-env
            - secretRef:
                name: {{ include "mp.fullname" . }}-secrets
