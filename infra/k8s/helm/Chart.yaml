apiVersion: v2
name: migration-platform
description: Helm chart for the Migration Platform (API, Go orchestrator, Python transform worker, Next.js UI)
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
home: https://example.com/migration-platform
maintainers:
  - name: Platform Team
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: minio
    version: "14.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: minio.enabled
  - name: temporal
    version: "0.x.x"
    repository: "https://go.temporal.io/helm-charts"
    condition: temporal.enabled
