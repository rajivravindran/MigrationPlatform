global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: migration-platform
    environment: dev

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "migration-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9464"]
        labels: { service: migration-api }

  - job_name: "migration-orchestrator"
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:9464"]
        labels: { service: migration-orchestrator }

  - job_name: "migration-transform-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["transform-worker:9464"]
        labels: { service: migration-transform-worker }

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels: { service: otel-collector }

  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]
        labels: { service: otel-collector-internal }

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: postgres }

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { service: redis }

  - job_name: "temporal"
    static_configs:
      - targets: ["temporal:9090"]
        labels: { service: temporal }
