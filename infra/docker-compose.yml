name: migration-platform

networks:
  migration:
    driver: bridge

volumes:
  pgdata: {}
  miniodata: {}
  lokidata: {}
  tempodata: {}
  grafanadata: {}
  promdata: {}

services:
  # ---------- Data plane ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migration
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [migration]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/migration?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    networks: [migration]

  redis:
    image: redis:7
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [migration]

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]
    networks: [migration]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - miniodata:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [migration]

  minio-setup:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 minio minio123; do sleep 1; done
        mc mb --ignore-existing local/migration
        mc mb --ignore-existing local/migration-results
        mc mb --ignore-existing local/migration-backups
        mc anonymous set none local/migration || true
        echo "minio buckets ready"
    networks: [migration]

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12_pgx
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      PROMETHEUS_ENDPOINT: 0.0.0.0:9090
      BIND_ON_IP: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["7233:7233", "9091:9090"]
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1 || bash -c '</dev/tcp/127.0.0.1/7233'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [migration]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    depends_on: [temporal]
    networks: [migration]

  # ---------- Observability ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      DEPLOY_ENV: dev
      TEMPO_OTLP_ENDPOINT: tempo:4317
      LOKI_ENDPOINT: http://loki:3100/loki/api/v1/push
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8888:8888", "8889:8889"]
    depends_on: [loki, tempo]
    networks: [migration]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    networks: [migration]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus, loki, tempo]
    networks: [migration]

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    ports: ["3100:3100"]
    networks: [migration]

  promtail:
    image: grafana/promtail:3.2.0
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    networks: [migration]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports: ["3200:3200", "4319:4317"]
    networks: [migration]

  # ---------- Application ----------
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/migration
      MASTER_KEY: "dev-master-key-change-me-000000000000000000000000"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [migration]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/migration
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      API_BIND: 0.0.0.0:8080
      METRICS_BIND: 0.0.0.0:9464
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: migration
      MASTER_KEY: "dev-master-key-change-me-000000000000000000000000"
      ORCHESTRATOR_BRIDGE_URL: http://orchestrator:7070
      BRIDGE_TOKEN: "dev-bridge-token-change-me"
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
    volumes:
      - ./secrets:/run/secrets:ro
    ports: ["8080:8080", "9464:9464"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      temporal: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }
    networks: [migration]

  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator-go/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/migration
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      ACTIVITY_CONCURRENCY: "64"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MASTER_KEY: "dev-master-key-change-me-000000000000000000000000"
      METRICS_BIND: 0.0.0.0:9464
      BRIDGE_ADDR: ":7070"
      BRIDGE_TOKEN: "dev-bridge-token-change-me"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: migration
      # Dev only: compose-network destinations resolve to private IPs.
      ALLOW_PRIVATE_DESTINATIONS: "true"
    ports: ["9465:9464"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
    networks: [migration]

  transform-worker:
    build:
      context: ..
      dockerfile: apps/transform-worker/Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      METRICS_ADDR: ":9464"
    ports: ["9466:9464"]
    depends_on:
      temporal: { condition: service_healthy }
    networks: [migration]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_INTERNAL_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]
    networks: [migration]
